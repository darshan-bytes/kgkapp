name: kgk
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+38

environment:
  sdk: ">=3.4.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # For State Management
  flutter_bloc: ^8.1.6

  # For API
  dartz: ^0.10.1
  http: ^1.2.2

  # For Device Info
  device_info_plus: ^11.2.0

  # For Connectivity
  connectivity_plus: ^6.1.1

  # For Local Storage
  hive: ^2.2.3

  # For Path Provider for File Path
  path_provider: ^2.1.5

  equatable: ^2.0.7

  # For Snackbar Message
  another_flushbar: ^1.12.30

  # For SVG Image File
  flutter_svg: ^2.0.16

  # For Cached Network Image
  cached_network_image: ^3.4.1

  # For Country Code Picker
  country_picker: ^2.0.27

  # For Carousel image Slider
  carousel_slider: ^5.0.0

  # For Rating Bar
  flutter_rating_bar: ^4.0.1

  #For Read more / Read less Text
  readmore: ^3.0.0

  #For Screen Util
  flutter_screenutil: ^5.9.3

  #For Dotted Border
  dotted_border: ^2.1.0

  #For Image Pick
  image_picker: ^1.1.2

  #For Permission Handle
  permission_handler: ^11.3.1

  #For Date Time Conversion
  intl: ^0.19.0

  #For Qr Code Scanner
  mobile_scanner: ^6.0.2

  #For Webview
  webview_flutter: ^4.10.0

  #For Google Map
  google_maps_flutter: ^2.10.0

  #For Range Sliders
  syncfusion_flutter_sliders: ^28.1.36

  #For Calendar
  syncfusion_flutter_calendar: ^28.1.36

  #For QR Code
  qr_flutter: ^4.1.0

  #For Share
  share_plus: ^10.1.3

  syncfusion_flutter_charts: ^28.1.36

  #For Bounce animation
  flutter_bounceable: ^1.1.0

  #For Video Player
  video_player: ^2.9.2

  html: ^0.15.5

  # mime_type and http_parser both Used in Multipart File Uploading in ApiService class
  mime_type: ^1.0.1
  http_parser: ^4.1.1

  # For Bloc Event Transformer
  rxdart: ^0.28.0

  # access location
  geolocator: ^13.0.2

  # For Url Launcher
  url_launcher: ^6.3.1
  flutter_branch_sdk: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/locales/

  fonts:
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EB_Garamond/EBGaramond-Regular.ttf

    - family: EBGaramondMedium
      fonts:
        - asset: assets/fonts/EB_Garamond/EBGaramond-Medium.ttf

    - family: EBGaramondSemiBold
      fonts:
        - asset: assets/fonts/EB_Garamond/EBGaramond-SemiBold.ttf

    - family: EBGaramondBold
      fonts:
        - asset: assets/fonts/EB_Garamond/EBGaramond-Bold.ttf

    - family: InterRegular
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf

    - family: InterMedium
      fonts:
        - asset: assets/fonts/Inter/Inter-Medium.ttf

    - family: InterSemiBold
      fonts:
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf

    - family: InterBold
      fonts:
        - asset: assets/fonts/Inter/Inter-Bold.ttf
